name: Last Letter Battle v2 smoke test
on:
  push:
    paths:
      - "last-letter-battle-v2/**"
  pull_request:
    paths:
      - "last-letter-battle-v2/**"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/smoke.mjs
        working-directory: last-letter-battle-v2
