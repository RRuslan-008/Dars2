<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kompyuter Asoslari</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #4f8cff;
    --text: #e8eaf0;
    --muted: #9aa1b0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  header {
    max-width: 700px;
    text-align: center;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 8px;
  }
  p.subtitle {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  .toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  a.button {
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.15s ease;
  }
  a.button:hover { opacity: 0.85; }
  .viewer {
    width: 100%;
    height: 80vh;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }
  .viewer iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  footer {
    margin-top: 24px;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <header>
    <h1>Kompyuter Asoslari</h1>
    <p class="subtitle">Windows OS o'rnatish, tizim komponentlari va xarakteristikalar tahlili</p>
  </header>

  <div class="card">
    <div class="toolbar">
      <a class="button" href="Kompyuter_Asoslari-10.pdf" download>PDF ni yuklab olish</a>
    </div>
    <div class="viewer">
      <iframe src="Kompyuter_Asoslari-10.pdf" title="Kompyuter Asoslari PDF"></iframe>
    </div>
  </div>

  <footer>© 2026</footer>
</body>
</html>
